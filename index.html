<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PDFの文章をブラウザ内だけで抽出する無料ツールです。">
  <title>PDF文章抽出 App.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo" aria-hidden="true">PDF</div>
      <div>
        <h1>PDF文章抽出 <span>App.</span></h1>
        <p>ファイルを送信せず、ブラウザの中だけで安全に文章を取り出します。</p>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card" aria-labelledby="upload-heading">
      <div class="section-heading">
        <span class="step">1</span>
        <div><h2 id="upload-heading">PDFを選ぶ</h2><p>文字情報を含むPDFに対応しています</p></div>
      </div>

      <div id="drop-zone" class="drop-zone" tabindex="0" role="button" aria-controls="file-input">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4a2 2 0 002 2h10a2 2 0 002-2v-4"/></svg>
        <strong>PDFをここにドラッグ＆ドロップ</strong>
        <span>または</span>
        <label class="button primary" for="file-input">PDFを選択</label>
        <input id="file-input" type="file" accept="application/pdf,.pdf" hidden>
      </div>

      <div id="file-info" class="file-info" hidden>
        <span class="file-icon">PDF</span>
        <div><small>選択中のファイル</small><strong id="file-name"></strong></div>
      </div>

      <div class="extract-row">
        <div class="extract-options" aria-label="抽出オプション">
          <label class="checkbox"><input id="format-text" type="checkbox" checked><span>文章を整形する</span></label>
          <label class="checkbox"><input id="show-separators" type="checkbox" checked><span>ページ区切りを表示する</span></label>
        </div>
        <button id="extract-button" class="button primary extract" type="button" disabled>文章を抽出</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="card result-card" aria-labelledby="result-heading">
      <div class="section-heading result-heading">
        <span class="step">2</span>
        <div><h2 id="result-heading">抽出結果</h2><p>文章はこの欄で直接編集できます</p></div>
        <span id="page-count" class="page-count" hidden></span>
      </div>
      <label class="sr-only" for="result-text">抽出された文章</label>
      <textarea id="result-text" placeholder="PDFから抽出した文章がここに表示されます" spellcheck="false"></textarea>
      <div class="actions">
        <button id="copy-button" class="button primary" type="button" disabled>
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v9a2 2 0 002 2h2"/></svg>全文コピー
        </button>
        <button id="clear-button" class="button secondary" type="button">クリア</button>
      </div>
    </section>

    <aside class="privacy-note"><span aria-hidden="true">🔒</span><div><strong>PDFは外部へ送信されません</strong><p>文章の抽出処理は、すべてお使いのブラウザ内で行われます。</p></div></aside>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite">コピーしました</div>

  <script type="module" src="script.js"></script>
</body>
</html>
